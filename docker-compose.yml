x-vllm-common: &a1
  restart: unless-stopped
  ipc: host
  networks:
    llmnet:
      aliases:
        - vllm-backend
  environment:
    ASCEND_VISIBLE_DEVICES: 0,1
    OMP_NUM_THREADS: "8"
    MALLOC_ARENA_MAX: "2"
  devices:
    - /dev/davinci0
    - /dev/davinci1
    - /dev/davinci_manager
    - /dev/devmm_svm
    - /dev/hisi_hdc
  ports:
    - 8002:8000
services:
  vllm-qwen25coder:
    <<: *a1
    image: quay.io/ascend/vllm-ascend:main-310p-openeuler-stable
    container_name: vllm-qwen25coder
    profiles:
      - prod
    volumes:
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
      - vllm-cache:/root/.cache/vllm
      - ${MODELS_DIR}/Qwen2.5-Coder-14B-Instruct-abliterated:/models/Qwen2.5-Coder-14B-Instruct-abliterated:ro
    command:
      - vllm
      - serve
      - /models/Qwen2.5-Coder-14B-Instruct-abliterated
      - --served-model-name
      - Qwen2.5-Coder-14B-Instruct-abliterated
      - --dtype
      - float16
      - --tensor-parallel-size
      - "2"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enforce-eager
      - --compilation-config
      - '{"mode":0}'
      - --max-model-len
      - "32768"
      - --max-num-batched-tokens
      - "32768"
      - --max-num-seqs
      - "32"
      - --gpu-memory-utilization
      - "0.95"
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
  vllm-qwen36moe:
    <<: *a1
    image: quay.io/ascend/vllm-ascend:v0.23.0-310p-openeuler
    container_name: vllm-qwen36moe
    profiles:
      - qwen36
    entrypoint:
      - /bin/bash
      - -c
    volumes:
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
      - vllm-cache:/root/.cache/vllm
      - ${MODELS_DIR}/Huihui-Qwen3.8-27B-abliterated:/models/Huihui-Qwen3.8-27B-abliterated:ro
    command:
      - >-
        mv /usr/local/python3.12.13/lib/python3.12/site-packages/triton
        /usr/local/python3.12.13/lib/python3.12/site-packages/triton.disabled &&
        exec vllm serve /models/Huihui-Qwen3.8-27B-abliterated
        --served-model-name qwen3.8-27b --trust-remote-code --tensor-parallel-size 2
        --dtype float16 --enforce-eager --max-model-len 16384 --max-num-seqs 16
        --gpu-memory-utilization 0.90
        --enable-prefix-caching --enable-chunked-prefill --max-num-batched-tokens 16384
        --mamba-ssm-cache-dtype float16 --reasoning-parser qwen3
        --enable-auto-tool-choice --tool-call-parser qwen3_coder
        --override-generation-config '{"temperature": 0.2, "repetition_penalty": 1.1}'
        --host 0.0.0.0 --port 8000
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    restart: unless-stopped
    networks:
      - llmnet
    ports:
      - 3000:8080
    volumes:
      - ./openwebui-data:/app/backend/data
    environment:
      OPENAI_API_BASE_URLS: http://vllm-backend:8000/v1
      OPENAI_API_KEYS: sk-no-key-required
      ENABLE_RAG_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search?q=<query>
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
      - llmnet
    ports:
      - 8080:8080
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
networks:
  llmnet: {}
volumes:
  vllm-cache: null
