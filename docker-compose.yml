x-vllm-common: &a1
  image: quay.io/ascend/vllm-ascend:main-310p-openeuler-stable
  restart: unless-stopped
  ipc: host
  networks:
    - llmnet
  environment:
    ASCEND_VISIBLE_DEVICES: 0,1
    OMP_NUM_THREADS: "8"
    MALLOC_ARENA_MAX: "2"
  devices:
    - /dev/davinci0
    - /dev/davinci1
    - /dev/davinci_manager
    - /dev/devmm_svm
    - /dev/hisi_hdc
  volumes:
    - /usr/local/dcmi:/usr/local/dcmi:ro
    - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
    - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro
    - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro
    - /etc/ascend_install.info:/etc/ascend_install.info:ro
    - ${MODELS_DIR}/Qwen2.5-Coder-14B-Instruct-abliterated:/models/Qwen2.5-Coder-14B-Instruct-abliterated:ro
    - vllm-cache:/root/.cache/vllm
services:
  vllm-qwen25coder:
    <<: *a1
    container_name: vllm-qwen25coder
    restart: unless-stopped
    ports:
      - 8002:8000
    command:
      - vllm
      - serve
      - /models/Qwen2.5-Coder-14B-Instruct-abliterated
      - --served-model-name
      - Qwen2.5-Coder-14B-Instruct
      - --dtype
      - float16
      - --tensor-parallel-size
      - "2"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enforce-eager
      - --compilation-config
      - '{"mode":0}'
      - --max-model-len
      - "32768"
      - --max-num-batched-tokens
      - "32768"
      - --max-num-seqs
      - "32"
      - --gpu-memory-utilization
      - "0.95"
      - --enable-prefix-caching
      - --enable-chunked-prefill
  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    restart: unless-stopped
    networks:
      - llmnet
    ports:
      - 3000:8080
    volumes:
      - ./openwebui-data:/app/backend/data
    environment:
      OPENAI_API_BASE_URLS: http://vllm-qwen25coder:8000/v1
      OPENAI_API_KEYS: sk-no-key-required
networks:
  llmnet: {}
volumes:
  vllm-cache: null
