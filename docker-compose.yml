x-vllm-common: &vllm-common
  image: quay.io/ascend/vllm-ascend:main-310p-openeuler
  restart: unless-stopped
  ipc: host
  networks: [llmnet]
  environment:
    ASCEND_VISIBLE_DEVICES: "2,3"
    OMP_NUM_THREADS: "1"
    MALLOC_ARENA_MAX: "2"
  devices:
    - /dev/davinci2
    - /dev/davinci3
    - /dev/davinci_manager
    - /dev/devmm_svm
    - /dev/hisi_hdc
  volumes:
    - /usr/local/dcmi:/usr/local/dcmi:ro
    - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
    - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64:ro
    - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info:ro
    - /etc/ascend_install.info:/etc/ascend_install.info:ro
    - ${MODELS_DIR}:/models
    - hf-cache:/root/.cache/huggingface
    - vllm-cache:/root/.cache/vllm

services:
  vllm-deepseek:
    <<: *vllm-common
    container_name: vllm-deepseek
    profiles: [deepseek]
    ports: ["8000:8000"]
    command:
      - vllm
      - serve
      - deepseek-ai/DeepSeek-R1-Distill-Qwen-32B
      - --dtype
      - float16
      - --tensor-parallel-size
      - "2"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enforce-eager
      - --reasoning-parser
      - deepseek_r1
      - --compilation-config
      - '{"mode":0}'
      - --max-model-len
      - "8192"
      - --max-num-batched-tokens
      - "8192"
      - --max-num-seqs
      - "32"
      - --gpu-memory-utilization
      - "0.95"
      - --swap-space
      - "8"

  vllm-qwen3:
    <<: *vllm-common
    container_name: vllm-qwen3
    profiles: [qwen3]
    ports: ["8001:8000"]
    command:
      - vllm
      - serve
      - Qwen/Qwen3-32B
      - --dtype
      - float16
      - --tensor-parallel-size
      - "2"
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enforce-eager
      - --reasoning-parser
      - qwen3          # remove if your vllm-ascend build doesn't support it
      - --compilation-config
      - '{"mode":0}'
      - --max-model-len
      - "8192"
      - --max-num-batched-tokens
      - "8192"
      - --max-num-seqs
      - "32"
      - --gpu-memory-utilization
      - "0.95"
      - --swap-space
      - "8"

  openwebui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: openwebui
    restart: unless-stopped
    networks: [llmnet]
    ports: ["3000:8080"]
    volumes:
      - ./openwebui-data:/app/backend/data
    environment:
      OPENAI_API_BASE_URLS: "http://vllm-deepseek:8000/v1;http://vllm-qwen3:8000/v1"
      OPENAI_API_KEYS: "sk-no-key-required;sk-no-key-required"

networks:
  llmnet: {}

volumes:
  hf-cache:
  vllm-cache:
